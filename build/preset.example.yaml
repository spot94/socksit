# Шаблон пресета установки.
#
# Пресет — это ПОЛНЫЙ файл конфигурации, который `socksit setup` (и кнопка
# «Установить» в панели) кладёт в C:\ProgramData\SocksIt\socksit.yaml. Не патч:
# каждый повторный запуск «Установить» перезаписывает конфиг целиком, поэтому
# всё, что не указано здесь, вернётся к значению по умолчанию. Дальше человек
# может менять настройки в панели — до следующего «Установить».
#
# Два способа доставки (вшитый побеждает файл-сосед):
#
#   A. Вшить в бинарь — один exe, отдельная сборка на каждый пресет:
#        cp build/preset.example.yaml internal/preset/preset.yaml   # и отредактировать
#        go build -tags "preset embed_engine" -ldflags="-H=windowsgui" -o socksit-setup.exe ./cmd/socksit
#
#   B. Файлом рядом — одна сборка, много пресетов:
#        положить как socksit.preset.yaml рядом с socksit.exe
#        (при установке из MSI — C:\Program Files\SocksIt\socksit.preset.yaml)
#
# Тихая раскатка через GPO/Intune: разовый elevated-запуск `socksit setup` —
# команда отрабатывает и выходит, GUI-сборка окон не показывает.
#
# Подробнее: docs/building-installers.md. Значения проверяются той же схемой,
# что и обычный конфиг: невалидный пресет установка отвергнет с ошибкой.

# ─────────────────────────────────────────────────────────── вышестоящий прокси
proxy:
  address: 10.0.0.1          # IP или имя хоста SOCKS5-сервера
  port: 1080
  udp: true                  # прокси UDP через SOCKS5 UDP ASSOCIATE

  # ВНИМАНИЕ про логин и пароль. Обычно они живут ТОЛЬКО в зашифрованном DPAPI-
  # хранилище на машине и в YAML не попадают. Но пресет пишется в socksit.yaml
  # как есть, поэтому указанные здесь учётные данные окажутся открытым текстом
  # и в раздаваемом установщике, и в C:\ProgramData\SocksIt\socksit.yaml.
  # Лучше не указывать их вовсе: пусть прокси пускает по адресу источника, либо
  # пользователь один раз введёт их в панели — оттуда они уйдут в DPAPI.
  # username: ""
  # password: ""

  # Адаптер, через который дозваниваться до прокси. Пустое значение = определять
  # самим (и переопределять при смене сети). Задавайте только если точно знаете,
  # что нужен конкретный адаптер: ручное значение служба менять не будет.
  # interface: "Ethernet"

# ─────────────────────────────────────────────────── какие приложения проксируем
# Имена процессов как есть, с .exe, регистр неважен. Для веб-сервисов указывайте
# БРАУЗЕР (chrome.exe / msedge.exe) — маршрутизация идёт по процессу, не по сайту.
mode: allowlist              # allowlist = только перечисленные | blocklist = все, кроме них
apps:
  - chrome.exe
  - msedge.exe

# proxy_all: true отправляет в прокси трафик всей машины и делает список выше
# бессмысленным. Для рабочих станций обычно не нужно.
proxy_all: false

# ─────────────────────────────────────────────────────── что мимо прокси, всегда
# По подсетям: применимо к соединениям, установленным по IP.
direct_subnets:
  - 192.168.0.0/16
  - 172.16.0.0/12
  - 10.0.0.0/8

# По именам: работает и для HTTPS (имя восстанавливается из SNI), и для DNS.
# Сюда же добавляются автоматически найденные шлюзы VPN-клиентов.
direct_domains:
  - .local
  - .lan
  - .internal
  - .home.arpa
  - .msftncsi.com            # проверка связи Windows: без этого значок сети врёт
  - .msftconnecttest.com
  # - vpn.example.com        # шлюз корпоративного VPN, если он не определился сам

# Диапазоны, которые вообще не заходят в туннель (уровень маршрутов ОС).
bypass_cidrs:
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 224.0.0.0/4
  - 255.255.255.255/32

# ─────────────────────────────────────────────────────────────────── поведение
kill_switch: true            # блокировать проксируемые приложения, пока туннель не поднят
show_tray: true              # значок в трее у пользователя

dns:
  fakeip_v4: 198.18.0.0/15   # менять, только если диапазон уже занят в вашей сети
  fakeip_all: true           # см. README: на Windows DNS-запросы шлёт служба, а не приложение

log:
  level: warn                # error | warn | info | debug | trace

control:
  clash_api: 127.0.0.1:9797  # локальный порт статистики; только loopback

# ───────────────────────────────────────────────────────────────── обновления
update:
  endpoint: https://github.com/spot94/socksit/releases/latest/download
  channel: stable
  mode: notify               # off | notify (спросить пользователя) | auto (ставить само)
  check_interval: 24h
  proxy: use-socks           # "" (напрямую) | system | use-socks | socks5://host:port

# ──────────────────────────────────────────────── управляемый конфиг с сервера
# Если раскатываете парк через конфиг-сервер, раскомментируйте блок: клиент сам
# будет забирать подписанный socksit.yaml и применять его. Учётные данные SOCKS
# фид не несёт никогда — их по-прежнему вводит пользователь или пускает прокси
# по адресу. Подробности: docs/configserver.md.
# config_source:
#   url: https://configs.example.com/configs/ai-team/socksit.yaml
#   interval: 1h
#   signed: true             # проверять подпись фида (не выключайте)
#   pubkey: "<base64 Ed25519 из раздела «Ключ подписи» админки>"
#   merge: override          # override = поверх локальных настроек | replace = заменить целиком
#   locked:                  # поля, которые пользователю нельзя менять локально
#     - kill_switch
#     - udp
